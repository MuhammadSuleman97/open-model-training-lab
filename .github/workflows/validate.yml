name: Validate public learning lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public artifact boundary
        run: python3 scripts/check_public_repo.py
      - name: Compile Python scripts
        run: python3 -m compileall -q scripts
      - name: Check learning guide JavaScript
        run: node --check learning/app.js
      - name: Check learning guide files
        run: python3 scripts/serve_learning_lab.py --check
